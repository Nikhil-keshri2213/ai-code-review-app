server:
  port: 8085

spring:
  application:
    name: review-storage-service

  datasource:
    url: jdbc:postgresql://localhost:5432/codereview
    username: codereview
    password: secret
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true