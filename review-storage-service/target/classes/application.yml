server:
  port: 8085

spring:
  application:
    name: review-storage-service
  datasource:
    url: jdbc:postgresql://localhost:5432/codereview
    username: codereview
    password: secret
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: storage-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.ai.codereview.*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.ai.codereview.common.dto.ReviewResult

kafka:
  topics:
    review-results: review-results

logging:
  level:
    com.ai.codereview: DEBUG
    org.springframework.kafka: INFO
    org.flywaydb: INFO

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true