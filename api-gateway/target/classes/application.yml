server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: webhook-service
          uri: http://localhost:8081
          predicates:
            - Path=/webhook/**

        - id: review-storage-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/reviews/**

        - id: review-storage-health
          uri: http://localhost:8085
          predicates:
            - Path=/api/dashboard/**

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.ai.codereview: DEBUG