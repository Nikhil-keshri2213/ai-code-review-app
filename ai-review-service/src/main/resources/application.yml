server:
  port: 8084

spring:
  application:
    name: ai-review-service
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: ai-review-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.ai.codereview.*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.ai.codereview.common.dto.ReviewRequest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

# ── Active provider — change this one line to switch ──
ai:
  provider: groq
  providers:
    groq:
      base-url: https://api.groq.com/openai/v1
      api-key: ${GROQ_API_KEY}
      model: llama-3.3-70b-versatile
    openai:
      base-url: https://api.openai.com/v1
      api-key: ${OPENAI_API_KEY:dummy}
      model: gpt-4o-mini
    ollama:
      base-url: http://localhost:11434/v1
      api-key: ${OLLAMA_API_KEY:dummy}
      model: llama3.2

kafka:
  topics:
    review-tasks: review-tasks
    review-results: review-results

logging:
  level:
    com.aicodereview: DEBUG
    org.springframework.kafka: INFO

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

openai:
  api:
    key: ${OPENAI_API_KEY}

github:
  token: ${GITHUB_TOKEN:dummy-token}