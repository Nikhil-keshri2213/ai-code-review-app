# version: '3.8'

services:

  # ── Infrastructure ──
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: ai-review-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks: [ai-review-net]
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: ai-review-kafka
    depends_on: [zookeeper]
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks: [ai-review-net]
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: ai-review-postgres
    environment:
      POSTGRES_DB: codereview
      POSTGRES_USER: codereview
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [ai-review-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codereview"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai-review-redis
    networks: [ai-review-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  weaviate:
    image: semitechnologies/weaviate:1.24.1
    container_name: ai-review-weaviate
    ports:
      - "8090:8080"
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      DEFAULT_VECTORIZER_MODULE: none
    networks: [ai-review-net]
    restart: unless-stopped

  # ── Services ──
  eureka-server:
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    container_name: ai-review-eureka
    ports:
      - "8761:8761"
    networks: [ai-review-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD","wget","--spider","-q","http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: ai-review-gateway
    ports:
      - "8080:8080"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
      JWT_SECRET: ${JWT_SECRET}
      SPRING_REDIS_HOST: redis
    depends_on:
      eureka-server:
        condition: service_healthy
    networks: [ai-review-net]
    restart: unless-stopped

  webhook-service:
    build:
      context: .
      dockerfile: webhook-service/Dockerfile
    container_name: ai-review-webhook
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
    depends_on:
      eureka-server:
        condition: service_healthy
    networks: [ai-review-net]
    restart: unless-stopped

  code-fetch-service:
    build:
      context: .
      dockerfile: code-fetch-service/Dockerfile
    container_name: ai-review-code-fetch
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
      GITHUB_TOKEN: ${GITHUB_TOKEN}
    depends_on:
      eureka-server:
        condition: service_healthy
    networks: [ai-review-net]
    restart: unless-stopped

  code-analysis-service:
    build:
      context: .
      dockerfile: code-analysis-service/Dockerfile
    container_name: ai-review-code-analysis
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
    depends_on:
      eureka-server:
        condition: service_healthy
    networks: [ai-review-net]
    restart: unless-stopped

  ai-review-service:
    build:
      context: .
      dockerfile: ai-review-service/Dockerfile
    container_name: ai-review-aireview
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
      GROQ_API_KEY: ${GROQ_API_KEY}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
    depends_on:
      eureka-server:
        condition: service_healthy
    networks: [ai-review-net]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g

  review-storage-service:
    build:
      context: .
      dockerfile: review-storage-service/Dockerfile
    container_name: ai-review-storage
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/codereview
      SPRING_DATASOURCE_USERNAME: codereview
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks: [ai-review-net]
    restart: unless-stopped

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: ai-review-notification
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}
    depends_on:
      eureka-server:
        condition: service_healthy
    networks: [ai-review-net]
    restart: unless-stopped

  prometheus:
      image: prom/prometheus:v2.52.0
      container_name: ai-review-prometheus
      ports:
        - "9090:9090"
      volumes:
        - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      command:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.retention.time=7d
      networks:
        - ai-review-net
      restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.2
    container_name: ai-review-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - ai-review-net
    depends_on:
      - prometheus
    restart: unless-stopped

networks:
  ai-review-net:
    driver: bridge

volumes:
  postgres-data:
  grafana_data: