server:
  port: 8082

spring:
  application:
    name: code-fetch-service
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: code-fetch-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.ai.codereview.*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.ai.codereview.common.dto.PullRequestEvent
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    listener:
      concurrency: 3

github:
  token: ${GITHUB_TOKEN}
  api:
    base-url: https://api.github.com

kafka:
  topics:
    pr-events: pr-events
    code-analysis-tasks: code-analysis-tasks

logging:
  level:
    com.ai.codereview: DEBUG
    org.springframework.kafka: INFO

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true