server:
  port: 8082

spring:
  config:
     import: optional:file:../.env[.properties]  
  application:
    name: code-fetch-service
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: code-fetch-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.ai.codereview.*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.ai.codereview.common.dto.PullRequestEvent

github:
  token: ${GITHUB_TOKEN}
  api:
    base-url: https://api.github.com

kafka:
  topics:
    pr-events: pr-events
    code-analysis-tasks: code-analysis-tasks

logging:
  level:
    com.ai.codereview: DEBUG
    org.springframework.kafka: INFO