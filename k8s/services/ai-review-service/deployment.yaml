apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-review-service
  namespace: ai-review
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-review-service
  template:
    metadata:
      labels:
        app: ai-review-service
    spec:
      containers:
        - name: ai-review-service
          image: ai-code-review-app-ai-review-service:latest
          imagePullPolicy: IfNotPresent

          envFrom:
            - configMapRef:
                name: ai-review-config
            - secretRef:
                name: ai-review-secrets

          ports:
            - containerPort: 8084

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            initialDelaySeconds: 180
            periodSeconds: 30
            timeoutSeconds: 5

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            initialDelaySeconds: 180
            periodSeconds: 30
            timeoutSeconds: 5