name: CD

# Fires automatically after the CI workflow completes on main
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

# Prevent overlapping deploys — queue them, never cancel in progress
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Kubernetes — ${{ matrix.service }}
    runs-on: ubuntu-latest

    # Only deploy if CI passed AND it was on main
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    strategy:
      # Deploy services sequentially — avoids Kafka/DB race conditions
      max-parallel: 1
      matrix:
        service:
          - eureka-server
          - api-gateway
          - webhook-service
          - code-fetch-service
          - code-analysis-service
          - ai-review-service
          - review-storage-service
          - notification-service

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Update image — ${{ matrix.service }}
        run: |
          kubectl set image deployment/${{ matrix.service }} \
            ${{ matrix.service }}=ghcr.io/${{ github.repository_owner }}/ai-review-${{ matrix.service }}:${{ github.event.workflow_run.head_sha }} \
            -n ai-review

      - name: Wait for rollout — ${{ matrix.service }}
        run: |
          kubectl rollout status deployment/${{ matrix.service }} \
            -n ai-review \
            --timeout=120s

      - name: Rollback on failure — ${{ matrix.service }}
        if: failure()
        run: |
          echo "Rollout failed for ${{ matrix.service }} — rolling back"
          kubectl rollout undo deployment/${{ matrix.service }} -n ai-review
