# =============================================================================
# .github/workflows/cd.yml
# AI Code Review Platform — Continuous Deployment
# Triggers: after CI workflow completes successfully on main branch
# - Decodes KUBE_CONFIG secret → deploys updated images → verifies rollout
# - Auto-rollback on failure
# NOTE: Requires a live Kubernetes cluster with KUBE_CONFIG secret set.
#       If no cluster is available, this workflow will skip gracefully.
# =============================================================================

name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

# Prevent overlapping deployments — never cancel in-progress deploys
concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/nikhil-keshri2213/ai-review
  K8S_NAMESPACE: ai-review

jobs:

  # ── Deploy to Kubernetes ────────────────────────────────────────────────────
  deploy:
    name: Deploy ${{ matrix.service }} to K8s
    runs-on: ubuntu-latest

    # Only run if CI passed on main branch
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    permissions:
      contents: read
      packages: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-gateway
            deployment: api-gateway
          - service: webhook-service
            deployment: webhook-service
          - service: code-fetch-service
            deployment: code-fetch-service
          - service: code-analysis-service
            deployment: code-analysis-service
          - service: ai-review-service
            deployment: ai-review-service
          - service: review-storage-service
            deployment: review-storage-service
          - service: notification-service
            deployment: notification-service
          - service: eureka-server
            deployment: eureka-server

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Verify cluster connection
        run: kubectl cluster-info --request-timeout=10s

      - name: Update image for ${{ matrix.service }}
        run: |
          kubectl set image deployment/${{ matrix.deployment }} \
            ${{ matrix.service }}=${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.event.workflow_run.head_sha }} \
            -n ${{ env.K8S_NAMESPACE }}

      - name: Wait for rollout — ${{ matrix.service }}
        run: |
          kubectl rollout status deployment/${{ matrix.deployment }} \
            -n ${{ env.K8S_NAMESPACE }} \
            --timeout=180s

      - name: Rollback on failure — ${{ matrix.service }}
        if: failure()
        run: |
          echo "Rollout failed for ${{ matrix.service }} — rolling back..."
          kubectl rollout undo deployment/${{ matrix.deployment }} \
            -n ${{ env.K8S_NAMESPACE }}
          echo "Rollback complete for ${{ matrix.service }}"

  # ── Post-deploy health check ────────────────────────────────────────────────
  verify:
    name: Verify Deployment
    runs-on: ubuntu-latest
    needs: deploy
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    steps:
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Check all pods are Running
        run: |
          echo "=== Pod Status ==="
          kubectl get pods -n ${{ env.K8S_NAMESPACE }}
          echo "=== HPA Status ==="
          kubectl get hpa -n ${{ env.K8S_NAMESPACE }}

      - name: Summary
        run: |
          echo "✅ Deployment complete — SHA: ${{ github.event.workflow_run.head_sha }}"
          kubectl get pods -n ${{ env.K8S_NAMESPACE }} --no-headers | \
            awk '{print $1, $3, $4}' | column -t
