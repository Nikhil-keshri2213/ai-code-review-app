name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Build & Test (all branches, all PRs)
  # ─────────────────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build and run unit tests
        run: mvn -B clean verify -DskipITs

      - name: Upload service JARs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: service-jars
          path: "**/target/*.jar"
          retention-days: 3

  # ─────────────────────────────────────────────
  # Job 2: Build & Push Docker images to GHCR
  # Only runs on main branch after tests pass
  # Uses matrix to avoid repeating build steps
  # ─────────────────────────────────────────────
  build-and-push-images:
    name: Build & Push — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'

    strategy:
      matrix:
        service:
          - api-gateway
          - webhook-service
          - code-fetch-service
          - code-analysis-service
          - ai-review-service
          - review-storage-service
          - notification-service
          - eureka-server

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build Docker image — ${{ matrix.service }}
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/ai-review-${{ matrix.service }}:${{ github.sha }} \
            -t ghcr.io/${{ github.repository_owner }}/ai-review-${{ matrix.service }}:latest \
            -f ${{ matrix.service }}/Dockerfile .

      - name: Push Docker image — ${{ matrix.service }}
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/ai-review-${{ matrix.service }}:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/ai-review-${{ matrix.service }}:latest
