# =============================================================================
# .github/workflows/ci.yml
# AI Code Review Platform — Continuous Integration
# Triggers: every push and pull_request on all branches
# - Job 1: build-and-test      → runs on every branch
# - Job 2: build-and-push      → runs only on main (after tests pass)
# =============================================================================

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/nikhil-keshri2213/ai-review

jobs:

  # ── Job 1: Build + Unit Tests ───────────────────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build and run unit tests (skip e2e — require Kafka/DB not available in CI)
        run: mvn -B clean verify -DskipITs -Dgroups='!e2e'
        env:
          MAVEN_OPTS: "-Xmx1024m"

      - name: Upload service JARs
        uses: actions/upload-artifact@v4
        with:
          name: service-jars
          path: "**/target/*.jar"
          retention-days: 3

  # ── Job 2: Docker Build + Push to GHCR ─────────────────────────────────────
  build-and-push-images:
    name: Build & Push Images (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-gateway
            module: api-gateway
          - service: webhook-service
            module: webhook-service
          - service: code-fetch-service
            module: code-fetch-service
          - service: code-analysis-service
            module: code-analysis-service
          - service: ai-review-service
            module: ai-review-service
          - service: review-storage-service
            module: review-storage-service
          - service: notification-service
            module: notification-service
          - service: eureka-server
            module: eureka-server

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build JAR for ${{ matrix.service }}
        run: mvn -B clean package -pl ${{ matrix.module }} -am -DskipTests
        env:
          MAVEN_OPTS: "-Xmx1024m"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.module }}/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max